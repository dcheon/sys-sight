name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: normal
            sanitizer_options: ""
          - name: ASan(address-sanitizer)
            sanitizer_options: "-DSYS_SIGHT_ENABLE_address=ON"
          - name: UBSan(undefined-behavior-sanitizer)
            sanitizer_options: "-DSYS_SIGHT_ENABLE_undefined=ON"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure (${{ matrix.name }})
        run: >
          cmake -S . -B build
          -DSYS_SIGHT_BUILD_TESTS=ON
          ${{ matrix.sanitizer_options }}
      - name: Build (${{ matrix.name }})
        run: cmake --build build --parallel
      - name: Run unit tests (${{ matrix.name }})
        run: ctest --test-dir build --output-on-failure --no-tests=error
        
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build-docker-image
        run: docker build -t sys-sight .