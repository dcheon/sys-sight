<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysSight Viewer</title>
<style>
:root {
  --bg: #fafafa; --panel: #ffffff; --raised: #f4f4f5; --fg: #171717; --sec: #525252; --muted: #737373;
  --line: rgba(23,23,23,.1); --focus: #2456c9;
  --warn: #b7791f; --err: #dc2626; --ok: #16a34a;
  --text: #2c5fd0; --rodata: #0f8a8a; --data: #b8790a; --heap: #2f8f4e; --mmap: #7d4cc4;
  --stack: #c43d6b; --kernel: #6b7280;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141415; --panel: #19191b; --raised: #232325; --fg: #ededed; --sec: #a1a1a6; --muted: #85858b;
    --line: rgba(237,237,237,.08); --focus: #7ba2ff;
    --warn: #e0b32e; --err: #ef6b6b; --ok: #4cc38a;
    --text: #7ba2ff; --rodata: #4cc9c9; --data: #e7a83a; --heap: #5fc47f; --mmap: #b58cf0;
    --stack: #f07aa0; --kernel: #9aa3b5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 8px; }
h2 { font-size: 1.05rem; font-weight: 500; margin: 40px 0 12px; }
.sub { color: var(--sec); margin: 0; }
.muted { color: var(--muted); }
code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.9em; }
button, .button { font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer;
  transition: background-color 120ms var(--ease), border-color 120ms var(--ease), transform 120ms var(--ease); }
button:hover, .button:hover { border-color: var(--muted); }
button:active, .button:active { transform: scale(.98); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 24px 0 12px; }
.toolbar input[type=file] { display: none; }
.toolbar > label:last-child { color: var(--sec); margin-left: 8px; }
#drop { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted);
  transition: border-color 120ms var(--ease), color 120ms var(--ease); }
body.dragging #drop { border-color: var(--fg); color: var(--fg); }
details { margin-top: 12px; }
textarea { width: 100%; min-height: 112px; margin: 8px 0; font: 12px ui-monospace, Consolas, monospace; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.banner { border: 1px solid; border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
.banner.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
.banner.error { color: var(--err); border-color: color-mix(in srgb, var(--err) 30%, transparent); background: color-mix(in srgb, var(--err) 8%, var(--panel)); }
.banner.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
.summary { display: flex; flex-wrap: wrap; gap: 4px 24px; }
.summary div span:first-child { color: var(--muted); margin-right: 8px; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
.map { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: 176px 1fr; gap: 16px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--kernel);
  border-radius: 8px; padding: 12px 16px; }
.row[data-kind=text] { border-left-color: var(--text); }
.row[data-kind=rodata] { border-left-color: var(--rodata); }
.row[data-kind=data] { border-left-color: var(--data); }
.row[data-kind=heap] { border-left-color: var(--heap); }
.row[data-kind=mmap] { border-left-color: var(--mmap); }
.row[data-kind=stack] { border-left-color: var(--stack); }
.row[data-kind=kernel] { border-left-color: var(--kernel); }
.addr { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; color: var(--fg); word-break: break-all; }
.addr .dim { color: var(--muted); }
.kind { font-weight: 500; color: var(--sec); text-transform: capitalize; }
.title { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { background: var(--raised); border-radius: 4px; padding: 2px 8px; font-size: 0.85rem; color: var(--sec); }
.frames { display: grid; gap: 2px; margin-top: 8px; }
.frame { background: var(--raised); border-radius: 4px; padding: 4px 12px; font-size: 0.9rem; }
.frame strong { font-weight: 500; }
.gap { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 4px 0; }
details summary { cursor: pointer; color: var(--sec); }
details ul { margin: 4px 0 0; padding-left: 16px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background-color 120ms var(--ease); }
tbody tr:hover { background: var(--raised); }
th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
@media (max-width: 720px) { .row { grid-template-columns: 1fr; gap: 4px; } main { padding: 24px 16px 48px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>SysSight Viewer</h1>
  <p class="sub">Memory layout from a <code>sys-sight</code> snapshot, low addresses on top</p>

  <div class="toolbar">
    <label class="button" for="file">Open file</label>
    <input id="file" type="file" accept=".jsonl,.json,.txt,text/plain">
    <button id="sample" type="button">Load sample</button>
    <label><input id="toolchain" type="checkbox"> Show toolchain symbols</label>
  </div>
  <div id="drop">Drop a sys-sight output file here</div>
  <details>
    <summary>Paste output</summary>
    <label for="paste" class="muted">Output of <code>sys-sight ./program</code></label>
    <textarea id="paste" spellcheck="false"></textarea>
    <button id="show" type="button">Show</button>
  </details>

  <div id="status" aria-live="polite"></div>
  <div id="result"></div>
</main>
<script src="model.js"></script>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
