<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysSight Viewer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1d2330; --muted: #5b6475; --line: #d9dce3;
  --accent: #2456c9; --warn-bg: #fff4d6; --warn-line: #d9a400; --err-bg: #fde4e4; --err-line: #c62f2f;
  --ok-bg: #e3f4e8; --ok-line: #2f8f4e;
  --text: #2c5fd0; --rodata: #0f8a8a; --data: #b8790a; --heap: #2f8f4e; --mmap: #7d4cc4;
  --stack: #c43d6b; --kernel: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171f; --panel: #1c212c; --fg: #e6e9f0; --muted: #9aa3b5; --line: #2f3646;
    --accent: #7ba2ff; --warn-bg: #3a3014; --warn-line: #e0b32e; --err-bg: #3d1c1c; --err-line: #ef6b6b;
    --ok-bg: #16301f; --ok-line: #5fc47f;
    --text: #7ba2ff; --rodata: #4cc9c9; --data: #e7a83a; --heap: #5fc47f; --mmap: #b58cf0;
    --stack: #f07aa0; --kernel: #9aa3b5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 28px 0 8px; }
.sub, .muted { color: var(--muted); }
code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.9em; }
button, .button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover, .button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.toolbar input[type=file] { display: none; }
#drop { border: 2px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); }
body.dragging #drop { border-color: var(--accent); color: var(--fg); }
textarea { width: 100%; min-height: 110px; font: 12px ui-monospace, Consolas, monospace; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.banner { border-left: 4px solid; border-radius: 4px; padding: 8px 12px; margin: 8px 0; }
.banner.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.banner.error { background: var(--err-bg); border-color: var(--err-line); }
.banner.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.summary { display: flex; flex-wrap: wrap; gap: 4px 24px; }
.summary div span:first-child { color: var(--muted); margin-right: 6px; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
.map { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--kernel);
  border-radius: 6px; padding: 8px 12px; }
.row[data-kind=text] { border-left-color: var(--text); }
.row[data-kind=rodata] { border-left-color: var(--rodata); }
.row[data-kind=data] { border-left-color: var(--data); }
.row[data-kind=heap] { border-left-color: var(--heap); }
.row[data-kind=mmap] { border-left-color: var(--mmap); }
.row[data-kind=stack] { border-left-color: var(--stack); }
.row[data-kind=kernel] { border-left-color: var(--kernel); }
.addr { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; color: var(--muted); word-break: break-all; }
.kind { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; }
.row[data-kind=text] .kind { color: var(--text); } .row[data-kind=rodata] .kind { color: var(--rodata); }
.row[data-kind=data] .kind { color: var(--data); } .row[data-kind=heap] .kind { color: var(--heap); }
.row[data-kind=mmap] .kind { color: var(--mmap); } .row[data-kind=stack] .kind { color: var(--stack); }
.row[data-kind=kernel] .kind { color: var(--kernel); }
.title { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 0.85rem; }
.frames { display: grid; gap: 4px; margin-top: 6px; }
.frame { border: 1px solid var(--stack); border-radius: 4px; padding: 4px 8px; font-size: 0.9rem; }
.gap { text-align: center; color: var(--muted); font-size: 0.8rem; }
details summary { cursor: pointer; }
details ul { margin: 4px 0 0; padding-left: 18px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
.scroll { overflow-x: auto; }
@media (max-width: 720px) { .row { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>
<main>
  <h1>SysSight Viewer</h1>
  <p class="sub">Shows the output of <code>sys-sight</code>. Low addresses are on top, like the process's address space.</p>

  <div class="toolbar">
    <label class="button" for="file">Open output file…</label>
    <input id="file" type="file" accept=".jsonl,.json,.txt,text/plain">
    <button id="sample" type="button">Load sample</button>
    <label><input id="toolchain" type="checkbox"> Show toolchain symbols</label>
  </div>
  <div id="drop">Drop a sys-sight output file here, or use the buttons above.</div>
  <details>
    <summary>Paste output instead</summary>
    <label for="paste" class="muted">Paste the output of <code>sys-sight ./program</code>:</label>
    <textarea id="paste" spellcheck="false"></textarea>
    <button id="show" type="button">Show</button>
  </details>

  <div id="status" aria-live="polite"></div>
  <div id="result"></div>
</main>
<script src="model.js"></script>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
